<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Windows の works と専用 WSL の部屋の関係。ai/ だけをマウントして渡す。" font-family="'Noto Sans JP','Yu Gothic',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0017c1"/></marker></defs>
<rect x="10" y="10" width="360" height="500" rx="10" fill="#f2f2f2" stroke="#767676" stroke-width="2"/>
<text x="190" y="48" font-size="24" text-anchor="middle" fill="#1a1a1a">Windows(works)</text>
<rect x="40" y="70" width="300" height="100" rx="10" fill="#ffffff" stroke="#767676" stroke-width="2"/>
<text x="190" y="114" font-size="24" text-anchor="middle" fill="#1a1a1a">_noai/</text>
<text x="190" y="146" font-size="18" text-anchor="middle" fill="#4d4d4d">原本・対応表(AI に見せない)</text>
