<text x="790" y="276" font-size="18" text-anchor="middle" fill="#4d4d4d">ai/ の中身だけが見える</text>
<rect x="640" y="330" width="300" height="100" rx="10" fill="#ffffff" stroke="#0017c1" stroke-width="2"/>
<text x="790" y="374" font-size="22" text-anchor="middle" fill="#1a1a1a">Claude Code</text>
<text x="790" y="406" font-size="18" text-anchor="middle" fill="#4d4d4d">一般ユーザー(ai)で動く</text>
<line x1="342" y1="250" x2="634" y2="250" stroke="#0017c1" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="490" y="235" font-size="20" text-anchor="middle" fill="#0017c1" font-weight="bold">room start がマウント</text>
