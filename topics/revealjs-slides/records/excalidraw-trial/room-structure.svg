<text x="190" y="244" font-size="24" text-anchor="middle" fill="#1a1a1a">ai/</text>
<text x="190" y="276" font-size="18" text-anchor="middle" fill="#4d4d4d">作業フォルダ(渡す)</text>
<rect x="40" y="330" width="300" height="100" rx="10" fill="#ffffff" stroke="#767676" stroke-width="2"/>
<text x="190" y="374" font-size="22" text-anchor="middle" fill="#1a1a1a">areas/ projects/ …</text>
<text x="190" y="406" font-size="18" text-anchor="middle" fill="#4d4d4d">そのほかの works</text>
<rect x="610" y="10" width="360" height="500" rx="10" fill="#e8f1fe" stroke="#0017c1" stroke-width="3"/>
<text x="790" y="48" font-size="24" text-anchor="middle" fill="#1a1a1a">部屋(専用の WSL)</text>
