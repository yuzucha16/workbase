<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-label="Windows の works と専用 WSL の部屋の関係。ai/ だけをマウントして渡す。" font-family="'Noto Sans JP','Yu Gothic',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0017c1"/></marker></defs>
<rect x="5" y="10" width="280" height="540" rx="10" fill="#f2f2f2" stroke="#767676" stroke-width="2"/>
<text x="145" y="48" font-size="24" text-anchor="middle" fill="#1a1a1a">Windows(works)</text>
<rect x="20" y="65" width="250" height="115" rx="10" fill="#ffffff" stroke="#767676" stroke-width="2"/>
<text x="145" y="104" font-size="22" text-anchor="middle" fill="#1a1a1a">_noai/</text>
<text x="145" y="130" font-size="20" text-anchor="middle" fill="#4d4d4d">原本・対応表</text>
<text x="145" y="156" font-size="20" text-anchor="middle" fill="#4d4d4d">(AI に見せない)</text>
<rect x="20" y="200" width="250" height="115" rx="10" fill="#e8f1fe" stroke="#0017c1" stroke-width="3"/>
<text x="145" y="252" font-size="22" text-anchor="middle" fill="#1a1a1a">ai/</text>
<text x="145" y="278" font-size="20" text-anchor="middle" fill="#4d4d4d">作業フォルダ(渡す)</text>
<rect x="20" y="335" width="250" height="115" rx="10" fill="#ffffff" stroke="#767676" stroke-width="2"/>
<text x="145" y="387" font-size="22" text-anchor="middle" fill="#1a1a1a">areas/ projects/ …</text>
<text x="145" y="413" font-size="20" text-anchor="middle" fill="#4d4d4d">そのほかの works</text>
<rect x="415" y="10" width="280" height="540" rx="10" fill="#e8f1fe" stroke="#0017c1" stroke-width="3"/>
<text x="555" y="48" font-size="24" text-anchor="middle" fill="#1a1a1a">部屋(専用の WSL)</text>
<rect x="430" y="65" width="250" height="115" rx="10" fill="none" stroke="#767676" stroke-width="2" stroke-dasharray="8 6"/>
<text x="555" y="117" font-size="22" text-anchor="middle" fill="#1a1a1a">/mnt/c は空</text>
<text x="555" y="143" font-size="20" text-anchor="middle" fill="#4d4d4d">automount を切る</text>
<rect x="430" y="200" width="250" height="115" rx="10" fill="#ffffff" stroke="#0017c1" stroke-width="3"/>
<text x="555" y="252" font-size="22" text-anchor="middle" fill="#1a1a1a">/mnt/room/&lt;Project&gt;</text>
<text x="555" y="278" font-size="20" text-anchor="middle" fill="#4d4d4d">ai/ の中身だけが見える</text>
<rect x="430" y="335" width="250" height="115" rx="10" fill="#ffffff" stroke="#0017c1" stroke-width="2"/>
<text x="555" y="387" font-size="22" text-anchor="middle" fill="#1a1a1a">Claude Code</text>
<text x="555" y="413" font-size="20" text-anchor="middle" fill="#4d4d4d">一般ユーザー(ai)で動く</text>
<line x1="287" y1="257" x2="409" y2="257" stroke="#0017c1" stroke-width="3.5" marker-end="url(#ah)"/>
<text x="350" y="218" font-size="20" text-anchor="middle" fill="#0017c1" font-weight="bold">room start</text>
<text x="350" y="242" font-size="20" text-anchor="middle" fill="#0017c1" font-weight="bold">がマウント</text>
<text x="350" y="302" font-size="20" text-anchor="middle" fill="#4d4d4d">成果物は</text>
<text x="350" y="327" font-size="20" text-anchor="middle" fill="#4d4d4d">room close</text>
<text x="350" y="352" font-size="20" text-anchor="middle" fill="#4d4d4d">で戻す</text>
<text x="555" y="485" font-size="20" text-anchor="middle" fill="#4d4d4d">interop を切る</text>
<text x="555" y="509" font-size="20" text-anchor="middle" fill="#4d4d4d">Windows のプログラムを</text>
<text x="555" y="533" font-size="20" text-anchor="middle" fill="#4d4d4d">起動できない</text>
